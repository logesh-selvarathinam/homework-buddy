name: Build APK and publish update

# Run it: Actions tab → "Build APK and publish update" → Run workflow,
# or push to the `release` branch, or push a tag like v1.0.1.
# The version comes from pyproject.toml (or from the tag).
on:
  push:
    tags: ["v*"]
    branches: ["release"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the update popup)"
        required: false
      mandatory:
        description: "Force everyone to update"
        type: boolean
        default: false

permissions:
  contents: write   # to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out version
        run: |
          set -x
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Building $V (build ${{ github.run_number }})"

      - name: Put Supabase settings into the app
        env:
          HB_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HB_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_config.py

      - name: Signing key (the same key every build, so updates install)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or missing"; exit 1; }
          [ -n "$KS_PW" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is empty or missing"; exit 1; }
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid. Paste the whole content of ANDROID_KEYSTORE_BASE64.txt again."; exit 1; }
          KS_PW="$(printf '%s' "$KS_PW" | tr -d ' \r\n\t')"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PW" -alias upload > /dev/null \
            || { echo "::error::Keystore could not be opened. Check ANDROID_KEYSTORE_PASSWORD (from ANDROID_KEYSTORE_PASSWORD.txt)."; exit 1; }
          echo "::add-mask::$KS_PW"
          echo "KS_PW_CLEAN=$KS_PW" >> "$GITHUB_ENV"
          echo "Signing key OK"

      - name: Install Flet
        run: pip install "flet-cli==1.1.3" "flet==1.1.3"

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/upload.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ env.KS_PW_CLEAN }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ env.KS_PW_CLEAN }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: upload
        run: |
          flet build apk --yes --build-version "$VERSION" --build-number "$BUILD" --no-rich-output
          ls -lh build/apk/
          APK=$(ls build/apk/*arm64-v8a*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || APK=$(ls build/apk/*.apk | head -1)
          cp "$APK" "homeworkbuddy-$VERSION-$BUILD.apk"
          ls -lh homeworkbuddy-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: homeworkbuddy-apk
          path: homeworkbuddy-*.apk

      - name: Publish GitHub Release (in-app update)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
          MANDATORY: ${{ github.event.inputs.mandatory }}
        run: |
          TAG="v$VERSION-b$BUILD"
          NAME="homeworkbuddy-$VERSION-$BUILD.apk"
          [ -n "$NOTES" ] || NOTES="$(git log -1 --pretty=%s)"
          export TAG NAME NOTES
          python - <<'EOF'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          json.dump({
              "version": os.environ["VERSION"],
              "build": int(os.environ["BUILD"]),
              "apk_url": f'https://github.com/{repo}/releases/download/{os.environ["TAG"]}/{os.environ["NAME"]}',
              "notes": os.environ["NOTES"],
              "mandatory": os.environ.get("MANDATORY") == "true",
          }, open("latest.json", "w"), indent=2)
          EOF
          cat latest.json
          V7=$(ls build/apk/*armeabi-v7a*.apk 2>/dev/null | head -1)
          EXTRA=""
          if [ -n "$V7" ]; then cp "$V7" "homeworkbuddy-$VERSION-$BUILD-older-phones.apk"; EXTRA="homeworkbuddy-$VERSION-$BUILD-older-phones.apk"; fi
          gh release create "$TAG" "$NAME" latest.json $EXTRA \
            --target "$GITHUB_SHA" --title "HomeworkBuddy $VERSION (build $BUILD)" --notes "$NOTES" --latest
